# Optional static-only nginx (без живого /api).
# Docker Compose больше не использует этот файл:
# контейнер поднимает Node: статика dist + пет API на :8080.
# Оставьте nginx, если раздаёте только фронт за своим прокси.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
