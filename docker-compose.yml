# Analyst Hall — Postgres 16 + Go (Vue dist) на 8080
# Скопируйте .env.example → .env и смените пароли перед продом.

services:
  postgres:
    image: postgres:16-alpine
    container_name: analyst-hall-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hall_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-analyst_hall}
    volumes:
      - hall-pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hall} -d ${POSTGRES_DB:-analyst_hall}"]
      interval: 5s
      timeout: 5s
      retries: 12

  academy:
    build: .
    image: analyst-hall:local
    container_name: analyst-hall
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      WEB_DIR: /app/web/dist
      DATA_DIR: /app/data
      DATABASE_URL: postgres://${POSTGRES_USER:-hall}:${POSTGRES_PASSWORD:-hall_dev_change_me}@postgres:5432/${POSTGRES_DB:-analyst_hall}?sslmode=disable
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@malo.academy}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe_Admin1!}
      PRO_EMAIL: ${PRO_EMAIL:-pro@malo.academy}
      PRO_PASSWORD: ${PRO_PASSWORD:-ChangeMe_Pro1!}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    ports:
      - "8080:8080"
    volumes:
      - hall-data:/app/data

volumes:
  hall-data:
    name: analyst-hall-ledger
  hall-pg:
    name: analyst-hall-pg
